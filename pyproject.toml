[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-DragonOrder"
version = "0.1.8"
description = "Plugin that allows the re-ordering of sidebar and tabs by dragging them into desired location within the UI."
authors = [
    { name = "jneilliii", email = "jneilliii+github@gmail.com" },
]
requires-python = ">=2.7,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
dragon_order = "octoprint_dragon_order"

[project.urls]
Homepage = "https://github.com/jneilliii/OctoPrint-DragonOrder"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_dragon_order",
    "octoprint_dragon_order.*",
]
